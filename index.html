<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Szymon's Website</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #f9f9f9;
      --text: #111;
      --subtle: #666;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111;
        --text: #f9f9f9;
        --subtle: #aaa;
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      flex-direction: column;
      transition: background 0.3s, color 0.3s;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 0.5rem;
    }

    p {
      font-size: 1.2rem;
      margin: 0.25rem 0;
    }

    .faint {
      color: var(--subtle);
      font-size: 0.95rem;
    }

    .dotcom {
      letter-spacing: 0.5px;
    }

    .contact {
      font-size: 1.3rem;
      margin-top: 1.5rem;
      margin-bottom: 0.5rem;
    }

    .emoji {
      font-size: 1.5rem;
      margin-left: 0.4rem;
    }
  </style>
</head>
<body>
  <h1>Szymon Mleczek</h1>
  <p class="contact">Contact Me <span class="emoji">👇</span></p>
  <p class="dotcom">szymon <span style="user-select:none;">[at]</span> szymonmleczek <span style="user-select:none;">[dot]</span> com</p>
  <p class="faint">Website version 2 launches soon</p>
</body>
</html>
